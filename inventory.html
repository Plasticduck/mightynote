<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#000000">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="MightyOps">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="mwico.ico">
    <link rel="icon" type="image/x-icon" href="mwico.ico">
    <title>Inventory Count - MightyOps</title>
    <link rel="stylesheet" href="styles.css?v=22">
    <style>
        .inventory-form {
            padding: var(--space-lg);
            display: flex;
            flex-direction: column;
            gap: var(--space-lg);
        }
        
        .category-tabs {
            display: flex;
            gap: var(--space-sm);
            flex-wrap: wrap;
            margin-bottom: var(--space-md);
        }
        
        .category-tab {
            padding: var(--space-sm) var(--space-md);
            background: var(--bg-elevated);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            color: var(--text-secondary);
            cursor: pointer;
            transition: all var(--transition-base);
            font-size: 0.9rem;
            font-weight: 500;
        }
        
        .category-tab:hover {
            background: var(--bg-hover);
            border-color: var(--white-15);
        }
        
        .category-tab.active {
            background: var(--accent-blue);
            color: var(--white);
            border-color: var(--accent-blue);
        }
        
        .selection-group {
            display: flex;
            flex-direction: column;
            gap: var(--space-md);
        }
        
        .items-list {
            display: flex;
            flex-direction: column;
            gap: var(--space-md);
            max-height: 400px;
            overflow-y: auto;
            padding: var(--space-md);
            background: var(--bg-secondary);
            border-radius: var(--radius-md);
            border: 1px solid var(--border-subtle);
        }
        
        .item-row {
            display: flex;
            align-items: center;
            gap: var(--space-md);
            padding: var(--space-md);
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
        }
        
        .item-info {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: var(--space-xs);
        }
        
        .item-brand {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--accent-blue);
        }
        
        .item-name {
            font-size: 0.95rem;
            color: var(--white);
        }
        
        .quantity-input {
            width: 100px;
            padding: var(--space-sm) var(--space-md);
            background: var(--bg-input);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            color: var(--white);
            font-size: 1rem;
            text-align: center;
        }
        
        .quantity-input:focus {
            outline: none;
            border-color: var(--accent-blue);
            box-shadow: 0 0 0 3px var(--accent-blue-dim);
        }
        
        .selected-items-summary {
            margin-top: var(--space-lg);
            padding: var(--space-lg);
            background: var(--bg-elevated);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
        }
        
        .selected-items-summary h3 {
            font-size: 1rem;
            font-weight: 600;
            color: var(--white);
            margin-bottom: var(--space-md);
        }
        
        .selected-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: var(--space-sm) 0;
            border-bottom: 1px solid var(--border-subtle);
        }
        
        .selected-item:last-child {
            border-bottom: none;
        }
        
        .selected-item-info {
            flex: 1;
        }
        
        .selected-item-label {
            font-size: 0.9rem;
            color: var(--text-secondary);
        }
        
        .selected-item-details {
            font-size: 0.85rem;
            color: var(--white);
            font-weight: 500;
        }
        
        .selected-item-quantity {
            font-size: 1rem;
            font-weight: 600;
            color: var(--accent-green);
        }
        
        .btn-submit-inventory {
            margin-top: var(--space-lg);
            width: 100%;
        }
        
        .empty-state {
            text-align: center;
            padding: var(--space-2xl);
            color: var(--text-muted);
        }
        
        .empty-state svg {
            width: 64px;
            height: 64px;
            margin: 0 auto var(--space-md);
            opacity: 0.3;
        }
    </style>
</head>
<body>
    <div class="app-container">
        <div class="bg-decoration"></div>

        <!-- Header -->
        <header class="app-header">
            <div class="logo">
                <img src="MW Logo.png" alt="MW Logo" class="logo-img">
                <span class="logo-text">Inventory Count</span>
            </div>
            <div class="header-actions">
                <a href="inventory-dashboard.html" class="btn-icon" title="View Inventory Reports">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M3 3h7v7H3zM14 3h7v7h-7zM14 14h7v7h-7zM3 14h7v7H3z"/>
                    </svg>
                </a>
                <a href="home.html" class="btn-icon" title="Back to Apps">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
                        <polyline points="9 22 9 12 15 12 15 22"/>
                    </svg>
                </a>
            </div>
        </header>

        <!-- Main Form Screen -->
        <main class="main-content">
            <div class="form-card">
                <div class="form-header">
                    <h2>Inventory Count</h2>
                    <p class="form-subtitle">Submitting as: <strong id="submitterName">Loading...</strong></p>
                </div>

                <div class="inventory-form">
                    <!-- Category Selection -->
                    <div class="form-group">
                        <label>Category</label>
                        <div class="category-tabs" id="categoryTabs">
                            <!-- Categories will be populated here -->
                        </div>
                    </div>

                    <!-- Brand Selection -->
                    <div class="form-group" id="brandGroup" style="display: none;">
                        <label for="brand">Brand</label>
                        <div class="select-wrapper">
                            <select id="brand" required>
                                <option value="">Select a brand...</option>
                            </select>
                            <span class="select-arrow">▼</span>
                        </div>
                    </div>

                    <!-- Items List -->
                    <div class="form-group" id="itemsGroup" style="display: none;">
                        <label>Items</label>
                        <div class="items-list" id="itemsList">
                            <!-- Items will be populated here -->
                        </div>
                    </div>

                    <!-- Selected Items Summary -->
                    <div class="selected-items-summary" id="summarySection" style="display: none;">
                        <h3>Items with Quantities</h3>
                        <div id="selectedItemsList">
                            <!-- Selected items will be shown here -->
                        </div>
                        <button type="button" class="btn-submit btn-submit-inventory" id="submitBtn">
                            Submit Inventory Count
                        </button>
                    </div>
                </div>
            </div>
        </main>

        <!-- Toast Notification -->
        <div class="toast hidden" id="toast">
            <span class="toast-icon">✓</span>
            <span class="toast-message">Inventory count submitted successfully!</span>
        </div>
    </div>

    <script src="inventory.js?v=22"></script>
    <script src="version-check.js"></script>
</body>
</html>
