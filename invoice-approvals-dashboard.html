<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#000000">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="MightyOps">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="mwico.ico">
    <link rel="icon" type="image/x-icon" href="mwico.ico">
    <title>Invoice Approval Dashboard - MightyOps</title>
    <link rel="stylesheet" href="styles.css?v=22">
    <style>
        .dashboard-content { padding: var(--space-lg); max-width: 1200px; margin: 0 auto; width: 100%; }
        .dashboard-head {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: var(--space-md);
            flex-wrap: wrap;
            margin-bottom: var(--space-lg);
        }
        .dashboard-head h2 { color: var(--white); font-size: 1.4rem; margin-bottom: 2px; letter-spacing: -0.02em; }
        .dashboard-head p { color: var(--text-secondary); font-size: 0.9rem; }
        .btn-group { display: flex; gap: var(--space-sm); flex-wrap: wrap; }
        .btn-dl {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 10px 16px;
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--white);
            background: var(--accent-blue);
            border: 1px solid var(--accent-blue);
            border-radius: var(--radius-md);
            cursor: pointer;
            transition: all var(--transition-base);
        }
        .btn-dl:hover { background: #0077ed; box-shadow: 0 4px 12px rgba(10, 132, 255, 0.3); transform: translateY(-1px); }
        .btn-dl.secondary {
            background: var(--white-05);
            color: var(--white);
            border-color: var(--border-color);
        }
        .btn-dl.secondary:hover { background: var(--white-10); box-shadow: none; transform: none; }

        .stats-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: var(--space-md);
            margin-bottom: var(--space-lg);
        }
        .stat-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            padding: var(--space-md) var(--space-lg);
        }
        .stat-card .stat-label {
            font-size: 0.75rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.08em;
            margin-bottom: 4px;
        }
        .stat-card .stat-value { font-size: 1.6rem; font-weight: 700; color: var(--white); }
        .stat-card .stat-sub { font-size: 0.8rem; color: var(--text-secondary); margin-top: 2px; }

        .filters-bar {
            display: flex;
            gap: var(--space-sm);
            flex-wrap: wrap;
            padding: var(--space-md);
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            margin-bottom: var(--space-md);
            align-items: center;
        }
        .filters-bar .form-group { margin: 0; flex: 1; min-width: 160px; }
        .filters-bar label { font-size: 0.7rem; color: var(--text-muted); display: block; margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.05em; }
        .filters-bar select,
        .filters-bar input {
            width: 100%;
            padding: 10px 12px;
            background: var(--bg-input);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            color: var(--white);
            font-size: 0.9rem;
        }
        .filters-bar .clear-btn {
            padding: 10px 14px;
            background: var(--white-05);
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            border-radius: var(--radius-sm);
            cursor: pointer;
            font-size: 0.85rem;
            align-self: flex-end;
        }
        .filters-bar .clear-btn:hover { background: var(--white-10); color: var(--white); }

        .table-wrap {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            overflow: hidden;
        }
        table.inv-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.9rem;
        }
        table.inv-table thead th {
            background: var(--bg-elevated);
            text-align: left;
            padding: 12px 16px;
            font-size: 0.72rem;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.06em;
            border-bottom: 1px solid var(--border-color);
        }
        table.inv-table tbody td {
            padding: 14px 16px;
            border-bottom: 1px solid var(--border-subtle);
            color: var(--white);
            vertical-align: middle;
        }
        table.inv-table tbody tr:last-child td { border-bottom: none; }
        table.inv-table tbody tr:hover { background: var(--bg-hover); }
        td.amount-cell { font-family: var(--font-mono); font-weight: 600; color: var(--accent-green); white-space: nowrap; }
        td.date-cell { color: var(--text-secondary); white-space: nowrap; }
        td.assignee-cell { color: var(--accent-blue); font-weight: 500; }
        .status-badge {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 12px;
            font-size: 0.72rem;
            font-weight: 600;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            background: var(--accent-yellow-dim);
            color: var(--accent-yellow);
            border: 1px solid var(--accent-yellow);
        }
        .status-badge.approved { background: var(--accent-green-dim); color: var(--accent-green); border-color: var(--accent-green); }
        .status-badge.rejected { background: var(--accent-red-dim); color: var(--accent-red); border-color: var(--accent-red); }
        .row-actions {
            display: inline-flex;
            gap: 6px;
        }
        .row-btn {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 6px 10px;
            font-size: 0.78rem;
            background: var(--white-05);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            color: var(--text-secondary);
            cursor: pointer;
            text-decoration: none;
        }
        .row-btn:hover { background: var(--white-10); color: var(--white); }
        .row-btn.danger:hover { background: var(--accent-red-dim); color: var(--accent-red); border-color: var(--accent-red); }

        .empty-state, .loading-state {
            padding: var(--space-2xl) var(--space-lg);
            text-align: center;
            color: var(--text-muted);
        }

        /* Mobile: hide less-critical columns, stack cards */
        @media (max-width: 768px) {
            .dashboard-content { padding: var(--space-md); }
            .dashboard-head { flex-direction: column; align-items: stretch; }
            table.inv-table thead { display: none; }
            table.inv-table, table.inv-table tbody, table.inv-table tr, table.inv-table td { display: block; width: 100%; }
            table.inv-table tbody tr {
                border-bottom: 1px solid var(--border-color);
                padding: 10px 0;
            }
            table.inv-table tbody td {
                border: none;
                padding: 4px 16px;
            }
            table.inv-table tbody td::before {
                content: attr(data-label);
                display: inline-block;
                width: 90px;
                color: var(--text-muted);
                font-size: 0.72rem;
                text-transform: uppercase;
                letter-spacing: 0.05em;
            }
        }
    </style>
</head>
<body>
    <div class="app-container">
        <div class="bg-decoration"></div>
        <header class="app-header">
            <div class="logo">
                <img src="MW Logo.png" alt="MW Logo" class="logo-img">
                <span class="logo-text">Invoice Approval Dashboard</span>
            </div>
            <div class="header-actions">
                <a href="invoice-approvals.html" class="btn-icon" title="New Invoice">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="12" y1="5" x2="12" y2="19"/>
                        <line x1="5" y1="12" x2="19" y2="12"/>
                    </svg>
                </a>
                <a href="home.html" class="btn-icon" title="Back to Apps">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
                        <polyline points="9 22 9 12 15 12 15 22"/>
                    </svg>
                </a>
            </div>
        </header>
        <main class="main-content">
            <div class="dashboard-content">
                <div class="dashboard-head">
                    <div>
                        <h2>Invoices</h2>
                        <p>All submitted invoices pending and historical. Export the full database as PDF.</p>
                    </div>
                    <div class="btn-group">
                        <button type="button" class="btn-dl secondary" id="exportCSVBtn">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                                <polyline points="7 10 12 15 17 10"/>
                                <line x1="12" y1="15" x2="12" y2="3"/>
                            </svg>
                            CSV
                        </button>
                        <button type="button" class="btn-dl" id="exportPDFBtn">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                                <polyline points="14 2 14 8 20 8"/>
                                <line x1="16" y1="13" x2="8" y2="13"/>
                                <line x1="16" y1="17" x2="8" y2="17"/>
                            </svg>
                            Download PDF Database
                        </button>
                    </div>
                </div>

                <div class="stats-row">
                    <div class="stat-card">
                        <div class="stat-label">Total Invoices</div>
                        <div class="stat-value" id="statTotal">0</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-label">Total Amount</div>
                        <div class="stat-value" id="statAmount">$0.00</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-label">Pending</div>
                        <div class="stat-value" id="statPending">0</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-label">Approvers</div>
                        <div class="stat-value" id="statApprovers">0</div>
                    </div>
                </div>

                <div class="filters-bar">
                    <div class="form-group">
                        <label for="filterAssignee">Assigned To</label>
                        <select id="filterAssignee">
                            <option value="">All</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="filterVendor">Vendor</label>
                        <input type="text" id="filterVendor" placeholder="Search vendor...">
                    </div>
                    <div class="form-group">
                        <label for="filterFrom">From</label>
                        <input type="date" id="filterFrom">
                    </div>
                    <div class="form-group">
                        <label for="filterTo">To</label>
                        <input type="date" id="filterTo">
                    </div>
                    <button type="button" class="clear-btn" id="clearFiltersBtn">Clear</button>
                </div>

                <div class="table-wrap">
                    <table class="inv-table" id="invoicesTable">
                        <thead>
                            <tr>
                                <th>#</th>
                                <th>Vendor</th>
                                <th>Assigned To</th>
                                <th>Invoice Date</th>
                                <th>Amount</th>
                                <th>Status</th>
                                <th>Submitted</th>
                                <th style="text-align: right;">Actions</th>
                            </tr>
                        </thead>
                        <tbody id="invoicesBody">
                            <tr><td colspan="8" class="loading-state">Loading invoices...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
        <div class="toast hidden" id="toast">
            <span class="toast-icon">&#10003;</span>
            <span class="toast-message">Success</span>
        </div>
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.1/jspdf.plugin.autotable.min.js"></script>
    <script src="invoice-approvals-dashboard.js?v=1"></script>
    <script src="version-check.js"></script>
</body>
</html>
