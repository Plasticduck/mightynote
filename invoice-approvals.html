<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#000000">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="MightyOps">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="mwico.ico">
    <link rel="icon" type="image/x-icon" href="mwico.ico">
    <title>Invoice Approval - MightyOps</title>
    <link rel="stylesheet" href="styles.css?v=22">
    <style>
        .form-card { max-width: 560px; }
        .evaluation-form {
            padding: var(--space-lg);
            display: flex;
            flex-direction: column;
            gap: var(--space-lg);
        }
        .dropzone {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: var(--space-sm);
            padding: var(--space-xl) var(--space-md);
            background: var(--bg-input);
            border: 2px dashed var(--border-color);
            border-radius: var(--radius-md);
            color: var(--text-secondary);
            text-align: center;
            cursor: pointer;
            transition: all var(--transition-base);
        }
        .dropzone:hover {
            background: var(--bg-hover);
            border-color: var(--accent-blue);
            color: var(--white);
        }
        .dropzone.dragover {
            background: var(--accent-blue-dim);
            border-color: var(--accent-blue);
            color: var(--white);
        }
        .dropzone svg {
            width: 36px;
            height: 36px;
            opacity: 0.8;
        }
        .dropzone-title {
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--white);
        }
        .dropzone-sub {
            font-size: 0.8rem;
            color: var(--text-muted);
        }
        .dropzone-browse {
            color: var(--accent-blue);
            text-decoration: underline;
            cursor: pointer;
        }
        .file-chip {
            display: flex;
            align-items: center;
            gap: var(--space-sm);
            padding: var(--space-sm) var(--space-md);
            background: var(--bg-elevated);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            font-size: 0.9rem;
            color: var(--white);
        }
        .file-chip svg { flex-shrink: 0; }
        .file-chip .file-name {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            flex: 1;
        }
        .file-chip .file-size {
            color: var(--text-muted);
            font-size: 0.8rem;
        }
        .btn-remove-file {
            background: transparent;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            padding: 4px;
            border-radius: 4px;
        }
        .btn-remove-file:hover {
            color: var(--accent-red);
            background: var(--white-05);
        }
        /* Dark styling for date + number inputs (global CSS only covers type=text) */
        #invoiceForm input[type="date"],
        #invoiceForm input[type="number"] {
            width: 100%;
            padding: 14px 16px;
            font-family: var(--font-primary);
            font-size: 1rem;
            color: var(--text-primary);
            background: var(--bg-input);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            transition: all var(--transition-base);
            color-scheme: dark;
        }
        #invoiceForm input[type="date"]:hover,
        #invoiceForm input[type="number"]:hover {
            background: var(--bg-hover);
            border-color: var(--white-15);
        }
        #invoiceForm input[type="date"]:focus,
        #invoiceForm input[type="number"]:focus {
            outline: none;
            border-color: var(--accent-blue);
            box-shadow: 0 0 0 3px var(--accent-blue-dim);
        }
        #invoiceForm input[type="date"]::-webkit-calendar-picker-indicator {
            filter: invert(0.8);
            cursor: pointer;
            opacity: 0.7;
        }
        #invoiceForm input[type="date"]::-webkit-calendar-picker-indicator:hover {
            opacity: 1;
        }
        /* Hide number spinners for a cleaner look */
        #invoiceForm input[type="number"]::-webkit-outer-spin-button,
        #invoiceForm input[type="number"]::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        #invoiceForm input[type="number"] {
            -moz-appearance: textfield;
        }

        .amount-input-wrapper {
            position: relative;
        }
        .amount-input-wrapper::before {
            content: '$';
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            pointer-events: none;
            font-weight: 500;
            z-index: 1;
        }
        #invoiceForm .amount-input-wrapper input[type="number"] {
            padding-left: 32px;
        }
    </style>
</head>
<body>
    <div class="app-container">
        <div class="bg-decoration"></div>
        <header class="app-header">
            <div class="logo">
                <img src="MW Logo.png" alt="MW Logo" class="logo-img">
                <span class="logo-text">Invoice Approval</span>
            </div>
            <div class="header-actions">
                <a href="invoice-approvals-dashboard.html" class="btn-icon" title="View Invoices">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M3 3h7v7H3zM14 3h7v7h-7zM14 14h7v7h-7zM3 14h7v7H3z"/>
                    </svg>
                </a>
                <a href="home.html" class="btn-icon" title="Back to Apps">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
                        <polyline points="9 22 9 12 15 12 15 22"/>
                    </svg>
                </a>
            </div>
        </header>
        <main class="main-content">
            <div class="form-card">
                <div class="form-header">
                    <h2>Invoice Approval</h2>
                    <p class="form-subtitle">Submitting as: <strong id="submitterName">Loading...</strong></p>
                </div>
                <form id="invoiceForm" class="evaluation-form">
                    <div class="form-group">
                        <label>Invoice File</label>
                        <div class="dropzone" id="dropzone">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                                <polyline points="17 8 12 3 7 8"/>
                                <line x1="12" y1="3" x2="12" y2="15"/>
                            </svg>
                            <span class="dropzone-title">Drag &amp; drop invoice here</span>
                            <span class="dropzone-sub">or <span class="dropzone-browse">browse files</span> (PDF, JPG, PNG &mdash; max 10 MB)</span>
                        </div>
                        <input type="file" id="fileInput" accept="application/pdf,image/*" style="display: none;">
                        <div id="fileChip" class="file-chip hidden">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                                <polyline points="14 2 14 8 20 8"/>
                            </svg>
                            <span class="file-name" id="fileName"></span>
                            <span class="file-size" id="fileSize"></span>
                            <button type="button" class="btn-remove-file" id="removeFileBtn" aria-label="Remove file">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <line x1="18" y1="6" x2="6" y2="18"/>
                                    <line x1="6" y1="6" x2="18" y2="18"/>
                                </svg>
                            </button>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="assignedTo">Assign To</label>
                        <div class="select-wrapper">
                            <select id="assignedTo" required>
                                <option value="">Select an approver...</option>
                                <option value="Matt Canales">Matt Canales</option>
                                <option value="Isabel Castaneda">Isabel Castaneda</option>
                                <option value="Lester Young">Lester Young</option>
                                <option value="Rance Breed">Rance Breed</option>
                                <option value="Aaron Messina">Aaron Messina</option>
                                <option value="Justin Gamboa">Justin Gamboa</option>
                                <option value="Kevan Jowers">Kevan Jowers</option>
                                <option value="Ernest Contreras">Ernest Contreras</option>
                            </select>
                            <span class="select-arrow">&#9660;</span>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="vendorName">Vendor Name</label>
                        <input type="text" id="vendorName" placeholder="e.g., Acme Supply Co." required>
                    </div>

                    <div class="form-group">
                        <label for="invoiceDate">Invoice Date</label>
                        <input type="date" id="invoiceDate" required>
                    </div>

                    <div class="form-group">
                        <label for="amount">Amount</label>
                        <div class="amount-input-wrapper">
                            <input type="number" id="amount" placeholder="0.00" step="0.01" min="0" required>
                        </div>
                    </div>

                    <button type="submit" class="btn-submit">
                        <span class="btn-text">Submit for Approval</span>
                    </button>
                </form>
            </div>
        </main>
        <div class="toast hidden" id="toast">
            <span class="toast-icon">&#10003;</span>
            <span class="toast-message">Invoice submitted successfully!</span>
        </div>
    </div>
    <script src="invoice-approvals.js?v=2"></script>
    <script src="version-check.js"></script>
</body>
</html>
