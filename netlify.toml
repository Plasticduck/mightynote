[build]
  publish = "."
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# Poll the payables@ M365 shared mailbox every 5 minutes and import invoices.
[functions."poll-payables-mailbox"]
  

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

[dev]
  port = 8888
  publish = "."
  functions = "netlify/functions"


