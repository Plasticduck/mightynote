<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#000000">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="MightyOps">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="mwico.ico">
    <link rel="icon" type="image/x-icon" href="mwico.ico">
    <title>Inventory Dashboard - MightyOps</title>
    <link rel="stylesheet" href="styles.css?v=22">
    <style>
        .dashboard-content {
            padding: var(--space-lg);
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: var(--space-md);
            margin-bottom: var(--space-xl);
        }
        
        .stat-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            padding: var(--space-md);
            text-align: center;
        }
        
        .stat-value {
            font-size: 2rem;
            font-weight: 700;
            color: var(--accent-blue);
            margin-bottom: var(--space-xs);
        }
        
        .stat-label {
            font-size: 0.85rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        
        .filters-section {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            padding: var(--space-lg);
            margin-bottom: var(--space-lg);
        }
        
        .filters-row {
            display: flex;
            gap: var(--space-md);
            flex-wrap: wrap;
            align-items: flex-end;
        }
        
        .export-section {
            margin-top: var(--space-lg);
            padding-top: var(--space-lg);
            border-top: 1px solid var(--border-color);
        }
        
        .inventory-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: var(--space-lg);
        }
        
        .inventory-table th,
        .inventory-table td {
            padding: var(--space-md);
            text-align: left;
            border-bottom: 1px solid var(--border-subtle);
        }
        
        .inventory-table th {
            background: var(--bg-elevated);
            color: var(--text-secondary);
            font-size: 0.85rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        
        .inventory-table td {
            color: var(--white);
        }
        
        .inventory-table tr:hover {
            background: var(--bg-hover);
        }
        
        .quantity-cell {
            font-weight: 600;
            color: var(--accent-green);
            text-align: right;
        }
        
        /* Date Input Styling */
        #filterDate {
            width: 100%;
            padding: 14px 16px;
            font-family: var(--font-primary);
            font-size: 1rem;
            color: var(--white);
            background: var(--bg-input);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            transition: all var(--transition-base);
            cursor: pointer;
        }
        
        #filterDate:hover {
            background: var(--bg-hover);
            border-color: var(--white-15);
        }
        
        #filterDate:focus {
            outline: none;
            border-color: var(--accent-blue);
            box-shadow: 0 0 0 3px var(--accent-blue-dim);
        }
        
        #filterDate::-webkit-calendar-picker-indicator {
            filter: invert(1);
            cursor: pointer;
            opacity: 0.7;
        }
        
        #filterDate::-webkit-calendar-picker-indicator:hover {
            opacity: 1;
        }
        
        /* Export Excel Button Styling */
        #exportExcelBtn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: var(--space-sm);
            padding: 12px 20px;
            font-family: var(--font-primary);
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--white);
            background: var(--accent-green);
            border: none;
            border-radius: var(--radius-md);
            cursor: pointer;
            transition: all var(--transition-base);
            box-shadow: 0 2px 8px rgba(48, 209, 88, 0.2);
        }
        
        #exportExcelBtn:hover {
            background: #28c048;
            box-shadow: 0 4px 12px rgba(48, 209, 88, 0.3);
            transform: translateY(-1px);
        }
        
        #exportExcelBtn:active {
            transform: translateY(0);
        }
        
        #exportExcelBtn svg {
            flex-shrink: 0;
        }
        
        #exportExcelBtn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
        
        /* Clear Button Styling */
        #clearFiltersBtn {
            padding: 12px 20px;
            font-family: var(--font-primary);
            font-size: 0.95rem;
            font-weight: 500;
            color: var(--white);
            background: var(--white-10);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            cursor: pointer;
            transition: all var(--transition-base);
        }
        
        #clearFiltersBtn:hover {
            background: var(--white-15);
            border-color: var(--white-15);
        }
        
        #clearFiltersBtn:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>
    <div class="app-container">
        <div class="bg-decoration"></div>

        <!-- Header -->
        <header class="app-header">
            <div class="logo">
                <img src="MW Logo.png" alt="MW Logo" class="logo-img">
                <span class="logo-text">Inventory Dashboard</span>
            </div>
            <div class="header-actions">
                <a href="inventory.html" class="btn-icon" title="Add Inventory Count">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="12" y1="5" x2="12" y2="19"/>
                        <line x1="5" y1="12" x2="19" y2="12"/>
                    </svg>
                </a>
                <a href="home.html" class="btn-icon" title="Back to Apps">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
                        <polyline points="9 22 9 12 15 12 15 22"/>
                    </svg>
                </a>
            </div>
        </header>

        <!-- Dashboard Content -->
        <main class="main-content">
            <div class="dashboard-content">
                <!-- Stats -->
                <div class="stats-grid">
                    <div class="stat-card">
                        <div class="stat-value" id="totalItems">0</div>
                        <div class="stat-label">Items Counted</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value" id="totalCategories">0</div>
                        <div class="stat-label">Categories</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value" id="lastUpdate">-</div>
                        <div class="stat-label">Last Update</div>
                    </div>
                </div>

                <!-- Filters -->
                <div class="filters-section">
                    <h3 style="margin-bottom: var(--space-md); color: var(--white);">Filters</h3>
                    <div class="filters-row">
                        <div class="form-group" style="flex: 1; min-width: 200px;">
                            <label for="filterCategory">Category</label>
                            <div class="select-wrapper">
                                <select id="filterCategory">
                                    <option value="">All Categories</option>
                                </select>
                                <span class="select-arrow">▼</span>
                            </div>
                        </div>
                        <div class="form-group" style="flex: 1; min-width: 200px;">
                            <label for="filterDate">Date</label>
                            <input type="date" id="filterDate">
                        </div>
                        <div class="form-group">
                            <button type="button" id="clearFiltersBtn">Clear</button>
                        </div>
                    </div>
                </div>

                <!-- Export Section -->
                <div class="export-section">
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: var(--space-md);">
                        <h3 style="color: var(--white); margin: 0;">Inventory Counts</h3>
                        <div style="display: flex; gap: var(--space-sm);">
                            <button type="button" id="exportExcelBtn">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                                    <polyline points="14 2 14 8 20 8"/>
                                    <line x1="16" y1="13" x2="8" y2="13"/>
                                    <line x1="16" y1="17" x2="8" y2="17"/>
                                    <polyline points="10 9 9 9 8 9"/>
                                </svg>
                                Export Excel
                            </button>
                        </div>
                    </div>
                    
                    <div style="background: var(--bg-card); border: 1px solid var(--border-color); border-radius: var(--radius-md); overflow: hidden;">
                        <table class="inventory-table">
                            <thead>
                                <tr>
                                    <th>Category</th>
                                    <th>Brand</th>
                                    <th>Item</th>
                                    <th style="text-align: right;">Quantity</th>
                                    <th>Submitted By</th>
                                    <th>Date</th>
                                </tr>
                            </thead>
                            <tbody id="inventoryTableBody">
                                <tr>
                                    <td colspan="6" style="text-align: center; padding: var(--space-xl); color: var(--text-muted);">
                                        Loading inventory counts...
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>

        <!-- Toast Notification -->
        <div class="toast hidden" id="toast">
            <span class="toast-icon">✓</span>
            <span class="toast-message">Export successful!</span>
        </div>
    </div>

    <!-- SheetJS for Excel export -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="inventory-dashboard.js?v=22"></script>
    <script src="version-check.js"></script>
</body>
</html>
